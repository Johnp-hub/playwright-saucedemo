name: Playwright E2E Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Configurar Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    # 2. Instalar dependencias del proyecto
    - name: Install dependencies
      run: npm ci

    # 3. Instalar los navegadores de Playwright con sus dependencias del SO
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 4. Ejecutar los tests de Playwright
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Vinculamos el secreto de GitHub a una variable de entorno de la máquina
        TEST_USER: ${{ secrets.LOGIN_USER }}
        TEST_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
        LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}

    # 5. Guardar el reporte de Playwright
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
